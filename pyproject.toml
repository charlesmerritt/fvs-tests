[project]
name = "fvs-test"
version = "0.1.0"
description = "Unified CLI for running and comparing FVS engines"
readme = "README.md"
authors = [
    { name = "charlesmerritt", email = "cem96047@uga.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
]

[project.scripts]
fvs-test = "fvs_test.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

[tool.pytest.ini_options]
markers = [
    "live_engine: invokes a locally installed FVS engine (opt in with FVS_TEST_LIVE=1)",
]
